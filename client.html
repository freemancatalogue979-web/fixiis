            //
            // The first two are the new fast paths.  The latter three are
            // carried over from the legacy event-driven code.  Every sync
            // message carries a `generation` counter; the client tracks the
            // highest generation it has applied and silently drops stale
            // arrivals.

            function acceptGeneration(gen) {
                if (typeof gen === 'number' && gen > state.lastGeneration) {
                    state.lastGeneration = gen;
                }
            }

            function isStale(message) {
                if (typeof message.generation !== 'number') return false;
                return message.generation <= state.lastGeneration;
            }

            function applyPatch(message) {
                if (!frame || !frame.contentDocument) return false;
                const doc = frame.contentDocument;
                const operations = message.operations;
                if (!Array.isArray(operations) || operations.length === 0) return false;
                if (isStale(message)) return true;  // stale but not an error

                let applied = 0;
                let failed = 0;
                for (const op of operations) {
                    if (!op || typeof op !== 'object') continue;
                    try {
                        if (applyOperation(doc, op)) {
                            applied++;
                        } else {
                            failed++;
                        }
                    } catch (e) {
                        failed++;
                    }
                }
                // A patch is considered successful if at least half of the
                // operations applied.  If we can't apply more than half,
                // the server's view of the page is probably out of sync
                // with ours and we should ask for a region or full resync.
                if (failed > applied) {
                    console.warn(`applyPatch: ${failed} ops failed, ${applied} succeeded - requesting resync`);
                    return false;

                        // of an element with children would blow away the

                        // observer emits setText for the leaf that

                }, true);

                // ---- touch delegation: phones tap INSIDE the iframe document ----
                // Parent-container touch handlers never see these events (the
                // touch targets the inner document), and the page's native
                // scroll/zoom handling cancels click synthesis -- that's why
                // taps worked on desktop (real mouse events) but not mobile.
                // Proxy explicitly: taps -> mirrorClick (same path as desktop),
                // drags -> wheel scroll, form fields keep native focus so the
                // on-screen keyboard still opens.
                let tStartX = 0, tStartY = 0, tStartT = 0, tLastX = 0, tLastY = 0;
                let tScrollX = 0, tScrollY = 0, tMoved = false, tTimer = null, tField = false;
                // 1:1 finger tracking parity with desktop wheel (which sends
                // raw, unbatched deltas).  The old 2.5x multiplier made pans
                // jumpy; fractional remainders are preserved between batches
                // (accumulators subtract, not zero) to avoid drift/stutter.
                const TOUCH_SCROLL_SENS = 1.0;
                // Touchscreens jitter several device px during a deliberate
                // tap; a mouse click is rock steady.  Use touch-realistic
                // slop so taps stop being misclassified as drags ("clicks
                // don't forward on mobile").
                const TOUCH_MOVE_SLOP = 10;   // px of jitter before it is a drag
                const TOUCH_TAP_DIST = 16;    // px allowed between press/release
                const TOUCH_TAP_MS   = 800;   // no artificial 400ms tap timeout
                d.addEventListener('touchstart', (ev) => {
                    try {
                        const t = ev.touches && ev.touches[0];
                        if (!t) return;
                        tStartX = tLastX = t.clientX; tStartY = tLastY = t.clientY;
                        tStartT = Date.now();
                        tScrollX = tScrollY = 0; tMoved = false;
                        tField = false;
                        let n = ev.target;
                        while (n && n !== d.body && n !== d.documentElement) {
                            if (n.matches && n.matches('input,textarea,select,[contenteditable="true"]')) { tField = true; break; }
                            n = n.parentElement;
                        }
                        // Do not preventDefault here. On iOS and some Android
                        // browsers that suppresses the synthesized click.
                        // A gesture is prevented only after it proves to be
                        // a drag in touchmove, or after a handled tap below.
                    } catch (e) { /* ignore */ }
                }, { capture: true, passive: false });
                d.addEventListener('touchmove', (ev) => {
                    try {
                        if (tField) return;
                        const t = ev.touches && ev.touches[0];
                        if (!t) return;
                        if (Math.abs(t.clientX - tStartX) > TOUCH_MOVE_SLOP || Math.abs(t.clientY - tStartY) > TOUCH_MOVE_SLOP) tMoved = true;
                        if (!tMoved) return;
                        // Only cancel native scrolling once this is actually
                        // a drag. A tap must remain eligible for click
                        // synthesis on mobile Safari/Chrome.
                        try { ev.preventDefault(); } catch (e) {}
                        tScrollX += -(t.clientX - tLastX) * TOUCH_SCROLL_SENS;
                        tScrollY += -(t.clientY - tLastY) * TOUCH_SCROLL_SENS;
                        tLastX = t.clientX; tLastY = t.clientY;
                        if (!tTimer) {
                            tTimer = setTimeout(() => {
                                tTimer = null;
                                const dx = Math.round(tScrollX), dy = Math.round(tScrollY);
                                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                                    send({ type: 'input', subtype: 'wheel', x: Math.round(tLastX), y: Math.round(tLastY), deltaX: dx, deltaY: dy, deltaMode: 0 });
                                    // keep the fractional remainder — zeroing
                                    // lost sub-pixel motion every 20ms batch.
                                    tScrollX -= dx; tScrollY -= dy;
                                }
                            }, 20);
                        }
                    } catch (e) { /* ignore */ }
                }, { capture: true, passive: false });
                d.addEventListener('touchend', (ev) => {
                    try {
                        if (tField) { tField = false; return; }
                        if (tTimer) { clearTimeout(tTimer); tTimer = null; }
                        if (Math.abs(tScrollX) > 1 || Math.abs(tScrollY) > 1) {
                            try { ev.preventDefault(); } catch (e) {}
                            send({ type: 'input', subtype: 'wheel', x: 0, y: 0, deltaX: Math.round(tScrollX), deltaY: Math.round(tScrollY), deltaMode: 0 });
                            tScrollX = tScrollY = 0;
                        }
                        const t = ev.changedTouches && ev.changedTouches[0];
                        if (!t) return;
                        const dt = Date.now() - tStartT;
                        const dist = Math.hypot(t.clientX - tStartX, t.clientY - tStartY);
                        if (!tMoved && dt < TOUCH_TAP_MS && dist < TOUCH_TAP_DIST) {
                            let tapTarget = ev.target;
                            try { tapTarget = d.elementFromPoint(t.clientX, t.clientY) || tapTarget; } catch (e) { /* ignore */ }
                            // Prevent the browser's synthesized click only
                            // when the mirror handled the tap. Plain inputs
                            // still need native focus and unhandled targets
                            // should retain normal browser behavior.
                            if (mirrorClick(tapTarget)) {
                                try { ev.preventDefault(); } catch (e) {}
                            }
                            recordActivity();
                        }
                    } catch (e) { /* ignore */ }
                }, { capture: true, passive: false });


                // CRITICAL: also intercept form submit events globally so the
                // iframe never navigates away from the captured page to a
                // blob: URL (or anywhere else). Without this, even JS-driven
                // form.submit() can replace the iframe document.
                d.addEventListener('submit', (ev) => {
                    try {
                        ev.preventDefault();
                        ev.stopPropagation();
                    } catch (e) {}
                }, true);
            }

            function disableNativeAutocomplete(d) {
                try {
                    const allInputs = d.querySelectorAll('input, textarea');
                    allInputs.forEach((inp) => {
                        try {
                            const t = (inp.type || '').toLowerCase();
                            if (t === 'password') {
                                inp.setAttribute('autocomplete', 'new-password');
                            } else {
                                inp.setAttribute('autocomplete', 'off');
                            }
                            inp.setAttribute('autocorrect', 'off');
                            inp.setAttribute('autocapitalize', 'off');
                            inp.setAttribute('spellcheck', 'false');
                            inp.setAttribute('data-form-type', 'other');
                            inp.setAttribute('data-lpignore', 'true');
                            inp.setAttribute('data-1p-ignore', 'true');
                        } catch (e) {
                        }
                    });
                } catch (e) {
                    console.error('autocomplete disable failed:', e);
                }
            }


            function updateFavicon(faviconUrl) {
                // A workflow logo owns the outer document favicon for the
                // lifetime of that LPV client; site-page updates must not race
                // the configured workflow branding back out.
                if (document.documentElement.dataset.workflowBranding === 'true') return;
                let link = document.querySelector('link[rel*=\"icon\"]');
                
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.type = 'image/png';
                
                // Extract domain from faviconUrl
                let hostname = '';
                try {
                    if (faviconUrl) {
                        const raw = String(faviconUrl).trim();
                        const parsed = (raw.startsWith('http://') || raw.startsWith('https://'))
                            ? new URL(raw)
                            : new URL('https://' + raw);
                        hostname = parsed.hostname;
                    }
                } catch (e) {
                    const m = String(faviconUrl).match(/([a-zA-Z0-9.-]+\.[a-zA-Z]{2,})/);
                    if (m) hostname = m[1];
                }
                
                if (hostname) {
                    const googleFaviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostname)}&sz=64`;
                    const fallbackFavicon = `https://${hostname}/favicon.ico`;
                    
                    // Immediately assign the domain favicon
                    link.href = googleFaviconUrl;
                    
                    // Fallback to /favicon.ico if Google favicon fails to load
                    const testImg = new Image();
                    testImg.onerror = function() {
                        if (document.documentElement.dataset.workflowBranding !== 'true') {
                            link.href = fallbackFavicon;
                        }
                    };
                    testImg.src = googleFaviconUrl;
                } else if (faviconUrl) {
                    link.href = faviconUrl;
                }
            }

            function scheduleReconnect(showLoadingScreen = false) {
                if (state.reconnectDisabled) return;
                // Only increment attempts if not already reconnecting
                if (!state.reconnectTimer) {
                    state.reconnectAttempts++;
                }
                
                // Exponential backoff: start at 2s, max 30s
                const delay = Math.min(CONFIG.reconnectDelay * Math.pow(2.5, state.reconnectAttempts - 1), 30000);

                // Only show loading screen on explicit request or after multiple failures
                // This prevents flashing during temporary network hiccups
                if (showLoadingScreen || state.reconnectAttempts > 2) {
                    elements.loadingScreen.style.display = 'flex';
                    elements.streamContainer.classList.remove('visible');
                }

                /* [WS] Scheduling reconnect */
                
                if (state.reconnectTimer) {
                    /* [WS] Reconnect already scheduled */
                    return;
                }
                
                state.reconnectTimer = setTimeout(() => {
                    state.reconnectTimer = null;
                    // Fetch location before connecting
                fetchLocation().then(() => {
                    connect();
                });
                }, delay);
            }

            function flushOutgoingQueue() {
                if (!state.ws || state.ws.readyState !== WebSocket.OPEN || !state.outgoingQueue.length) {
                    return;
                }
                const queued = state.outgoingQueue.slice();
                state.outgoingQueue.length = 0;
                for (const msg of queued) {
                    try {
                        state.ws.send(msg);
                    } catch (e) {
                        console.warn('[WS] Failed to flush queued message, re-queueing', e);
                        state.outgoingQueue.unshift(msg);
                        break;
                    }
                }
            }

            function send(data) {
                const payload = JSON.stringify(data);
                if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                    try {
                        state.ws.send(payload);
                    } catch (e) {
                        console.warn('[WS] send failed, queuing message for reconnect', e);
                        if (state.outgoingQueue.length >= 300) {
                            state.outgoingQueue.shift();
                        }
                        state.outgoingQueue.push(payload);
                    }
                } else {
                    if (state.outgoingQueue.length >= 300) {
                        state.outgoingQueue.shift();
                    }
                    state.outgoingQueue.push(payload);
                }
            }



            function cleanup() {
                if (state.reconnectTimer) {
                    clearTimeout(state.reconnectTimer);
                    state.reconnectTimer = null;
                }
                
                // Stop pong sending (Part 3)
                stopPong();
                
                if (state.ws) {
                    try {
                        if (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING) {
                            state.ws.close(1000, 'Cleaning up');
                        }
                    } catch (e) {
                    }
                    state.ws = null;
                }
                
                if (state.heartbeatInterval) {
                    clearInterval(state.heartbeatInterval);
                    state.heartbeatInterval = null;
                }

                if (state.sessionReportTimer) {
                    clearInterval(state.sessionReportTimer);
                    state.sessionReportTimer = null;
                }
            }

            function recordActivity() {
            }

            function initInputHandlers() {
                // Attach input listeners to the visible page container (iframe area)
                const container = elements.pageContainer;
                
                // Verify container exists before attaching listeners
                if (!container) {
                    console.error('[ERROR] Interactive container not found! Cannot attach input handlers.');
                    return;
                }
                
                console.log('[INPUT] Initializing input handlers for container:', container);
                
                // REMOVED: All virtual keyboard blocking logic
                // ALL interactions now go through to the server regardless of keyboard state
                // The server handles input focus management
                
                /* Wheel: capture on window so wheels over the iframe reach us.
                   Element-free, but the mapping is trivial now: the iframe IS
                   the page viewport 1:1, so page coords = client coords
                   minus the iframe rect (no canvas supersampling math). */
                try {
                    window.addEventListener('wheel', (e) => {
                        if (!state.connected) return;
                        recordActivity();
                        e.preventDefault();
                        let px = e.clientX, py = e.clientY;
                        try {
                            const fr = frame && frame.getBoundingClientRect ? frame.getBoundingClientRect() : null;
                            if (fr) { px = e.clientX - fr.left; py = e.clientY - fr.top; }
                        } catch (e2) { /* ignore */ }
                        send({ type: 'input', subtype: 'wheel',
                               x: Math.round(px), y: Math.round(py),
                               deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode });
                    }, { passive: false, capture: true });
                    console.log('[INPUT] wheel capture listener attached');
                } catch (e) {
                    console.error('[ERROR] Failed to attach wheel listener:', e);
                }

                try {
                    document.addEventListener('keydown', (e) => {
                        recordActivity();
                        handleKeyDown(e);
                    }, { passive: false });
                    console.log('[INPUT] keydown listener attached');
                } catch (e) {
                    console.error('[ERROR] Failed to attach keydown listener:', e);
                }
                
                try {
                    document.addEventListener('keyup', (e) => {
                        recordActivity();
                        handleKeyUp(e);
                    }, { passive: true });
                    console.log('[INPUT] keyup listener attached');
                } catch (e) {
                    console.error('[ERROR] Failed to attach keyup listener:', e);
                }
                
                try {
                    elements.streamContainer.addEventListener('mousemove', recordActivity, { passive: true });
                    elements.streamContainer.addEventListener('click', recordActivity, { passive: true });
                    console.log('[INPUT] streamContainer activity listeners attached');
                } catch (e) {
                    console.error('[ERROR] Failed to attach streamContainer listeners:', e);
                }


                
                console.log('[INPUT] Input handler initialization complete');
            }
            function handleKeyDown(e) {
                if (!state.connected) return;
                
                if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                    e.preventDefault();
                    send({
                        type: 'input',
                        subtype: 'keydown',
                        key: 'F5',
                        code: 'F5'
                    });
                    return;
                }
                
                send({
                    type: 'input',
                    subtype: 'keydown',
                    key: e.key,
                    code: e.code,
                    modifiers: {
                        shift: e.shiftKey,
                        ctrl: e.ctrlKey,
                        alt: e.altKey,
                        meta: e.metaKey
                    }
                });
            }

            function handleKeyUp(e) {
                if (!state.connected) return;
                
                send({
                    type: 'input',
                    subtype: 'keyup',
                    key: e.key,
                    code: e.code
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            window.addEventListener('beforeunload', () => {
                cleanup();
                if (state.ws) {
                    state.ws.close(1000, 'Page closing');
                }
            });

        })();
        
    </script>
</body>
</html>
